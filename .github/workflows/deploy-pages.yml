name: Deploy parish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: parish-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Firebase web configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "Missing VITE_FIREBASE_API_KEY in GitHub Actions secrets or variables."
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          if "__FIREBASE_API_KEY__" not in html:
              raise SystemExit("Firebase API key placeholder was not found.")
          path.write_text(html.replace("__FIREBASE_API_KEY__", os.environ["FIREBASE_API_KEY"]), encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Wait for Pages artifact indexing
        run: sleep 10

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
