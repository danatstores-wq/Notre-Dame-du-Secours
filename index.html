<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كنيسة سيدة المعونات | Église Notre-Dame du Secours</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-light: #fff0b3;
      --gold: #e5b657;
      --gold-dark: #a87424;
      --navy-card: rgba(11, 29, 58, 0.86);
      --navy-nav: #07152c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050e1d;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    html[lang="fr"] body,
    html[lang="it"] body {
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: #081833;
      background-image: linear-gradient(to bottom, rgba(8,24,51,0.15) 0%, rgba(8,24,51,0.65) 48%, #081833 62%), url('assets/backgrounds/bg.jpg');
      background-size: 100% auto;
      background-repeat: no-repeat;
      background-position: top center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 18px 16px 0;
    }
    .emblem { width: 58px; height: 58px; }
    .header-title {
      text-align: center;
      flex: 1;
      padding: 0 6px;
    }
    .header-title h1 {
      font-family: 'Amiri', 'Playfair Display', serif;
      font-size: 1.65rem;
      line-height: 1.2;
      color: var(--gold-light);
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    }
    .header-title p {
      font-size: 0.78rem;
      color: #f3e5c0;
      margin-top: 4px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }
    .top-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .lang-btn {
      background: rgba(11, 29, 58, 0.8);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .hero-spacer { height: 210px; }
    .welcome-banner {
      text-align: center;
      padding: 0 16px 12px;
    }
    .welcome-banner h2 {
      font-family: 'Amiri', 'Playfair Display', serif;
      font-size: 1.55rem;
      color: var(--gold-light);
      text-shadow: 0 2px 12px rgba(0,0,0,0.95);
    }
    .welcome-banner p {
      font-size: 0.9rem;
      color: #f5e6c4;
      margin-top: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.95);
    }
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 6px 24px 12px;
    }
    .divider span {
      height: 1px;
      flex: 1;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }
    .divider img { width: 20px; height: 20px; }
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 14px 18px;
    }
    .card {
      background: linear-gradient(145deg, rgba(16, 42, 82, 0.92), rgba(7, 20, 43, 0.95));
      border: 1.5px solid var(--gold);
      border-radius: 18px;
      padding: 12px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,240,179,0.25);
      transition: transform 0.15s ease;
    }
    .card:active { transform: scale(0.98); }
    .card img { width: 40px; height: 40px; flex-shrink: 0; }
    .card-text { flex: 1; }
    .card-text h3 { font-size: 0.85rem; color: #fff; line-height: 1.25; }
    .card-text p { font-size: 0.72rem; color: #d8c396; margin-top: 2px; }
    .feature-screen{display:none;padding:18px 16px 24px;min-height:55vh}
    .feature-screen.visible{display:block}.home-view.hidden{display:none}
    .screen-heading{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .screen-heading h2{color:var(--gold-light);font-size:1.15rem}
    .back-btn,.feature-tab{border:1px solid var(--gold);background:rgba(11,29,58,.85);color:var(--gold-light);border-radius:12px;padding:9px 13px;font:inherit;cursor:pointer}
    .feature-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}
    .feature-tab{padding:9px 4px;font-size:.78rem}.feature-tab.active{background:var(--gold);color:#081833;font-weight:700}
    .feature-content{background:rgba(11,29,58,.78);border:1px solid rgba(229,182,87,.65);border-radius:16px;padding:16px;min-height:120px}
    .empty-state{text-align:center;color:#f3e5c0;line-height:1.8;padding:18px 4px}
    .schedule-entry{padding:12px 4px;border-bottom:1px solid rgba(229,182,87,.25)}
    .rosary-mysteries{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
    .mystery-choice{background:rgba(11,29,58,.9);border:1px solid var(--gold);border-radius:14px;padding:13px 9px;color:#fff;text-align:center;font:inherit;cursor:pointer}
    .mystery-choice.active{background:rgba(229,182,87,.22);box-shadow:0 0 0 1px var(--gold) inset}
    .mystery-choice small{display:block;color:#e8d5a9;margin-top:5px;font-size:.7rem}
    .rosary-progress{height:7px;background:#263b5b;border-radius:9px;overflow:hidden;margin:12px 0}
    .rosary-progress span{display:block;height:100%;background:var(--gold);width:0}
    .rosary-controls{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
    .rosary-controls button{flex:1}.rosary-step{text-align:center;padding:18px 6px;line-height:1.8}.rosary-step h3{color:var(--gold-light);margin-bottom:8px}
    .bottom-nav {
      background: var(--navy-nav);
      border-top: 1.5px solid var(--gold);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 4px 12px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #d8c396;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .nav-item.active { color: var(--gold-light); font-weight: 700; }
    .nav-item img { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="home-view" id="home-view">
      <header class="top-bar">
        <img src="assets/icons/logo-marian-emblem.png" alt="Emblem" class="emblem" />
        <div class="header-title">
          <h1 id="app-title">كنيسة سيدة المعونات</h1>
          <p id="app-subtitle">- رعيتنا بيت الصلاة والإيمان -</p>
        </div>
        <div class="top-actions">
          <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">Français</button>
          <img src="assets/icons/icon-settings.png" alt="Settings" style="width:26px;height:26px;" />
        </div>
      </header>

      <div class="hero-spacer"></div>

      <section class="welcome-banner">
        <h2 id="welcome-text">أهلاً بكم في رعيتنا</h2>
        <p id="motto-text">«سيدة المعونات .. تشفع فينا»</p>
      </section>

      <div class="divider">
        <span></span>
        <img src="assets/icons/icon-cross-divider.png" alt="Cross" />
        <span></span>
      </div>

      <main class="cards-grid" id="cards-container"></main>
    </div>
    <section class="feature-screen" id="mass-screen" aria-live="polite">
      <div class="screen-heading"><button class="back-btn" onclick="closeFeature()" id="mass-back">←</button><h2 id="mass-title"></h2></div>
      <div class="feature-tabs" id="mass-tabs"></div><div class="feature-content" id="mass-content"></div>
    </section>
    <section class="feature-screen" id="rosary-screen" aria-live="polite"><div class="screen-heading"><button class="back-btn" onclick="closeRosary()" id="rosary-back">←</button><h2 id="rosary-title"></h2></div><div class="feature-content" id="rosary-content"></div></section><nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <script>
    const translations = {
      "ar": {
        "dir": "rtl",
        "title": "كنيسة سيدة المعونات",
        "subtitle": "- رعيتنا بيت الصلاة والإيمان -",
        "welcome": "أهلاً بكم في رعيتنا",
        "motto": "«سيدة المعونات .. تشفع فينا»",
        "toggle": "Français",
        "cards": [
          [
            "مواعيد القداديس",
            "والنشاطات",
            "assets/icons/icon-calendar.png"
          ],
          [
            "المسبحة الوردية",
            "ابدأ الصلاة",
            "assets/icons/icon-rosary.png"
          ],
          [
            "مكتبة الصلوات",
            "مع الصوت والنص",
            "assets/icons/icon-bible.png"
          ],
          [
            "رسائل الكاهن",
            "وأخبار الرعية",
            "assets/icons/icon-megaphone.png"
          ],
          [
            "حياة الرعية",
            "ونشاطاتنا",
            "assets/icons/icon-church.png"
          ],
          [
            "طلبات الصلاة",
            "لنصلِّ معاً",
            "assets/icons/icon-praying-hands.png"
          ]
        ],
        "nav": [
          "الرئيسية",
          "الإشعارات",
          "المفضلة",
          "حول التطبيق"
        ]
      },
      "fr": {
        "dir": "ltr",
        "title": "Église Notre-Dame du Secours",
        "subtitle": "- Notre paroisse, maison de prière et de foi -",
        "welcome": "Bienvenue dans notre paroisse",
        "motto": "« Notre-Dame du Secours, priez pour nous »",
        "toggle": "Italiano",
        "cards": [
          [
            "Horaires des Messes",
            "et Activités",
            "assets/icons/icon-calendar.png"
          ],
          [
            "Le Saint Rosaire",
            "Commencer la prière",
            "assets/icons/icon-rosary.png"
          ],
          [
            "Bibliothèque de Prières",
            "Audio et Texte",
            "assets/icons/icon-bible.png"
          ],
          [
            "Messages du Curé",
            "et Actualités paroissiales",
            "assets/icons/icon-megaphone.png"
          ],
          [
            "Vie Paroissiale",
            "et Nos Activités",
            "assets/icons/icon-church.png"
          ],
          [
            "Intentions de Prière",
            "Prions ensemble",
            "assets/icons/icon-praying-hands.png"
          ]
        ],
        "nav": [
          "Accueil",
          "Notifications",
          "Favoris",
          "À propos"
        ]
      },
      "it": {
        "dir": "ltr",
        "title": "Chiesa Nostra Signora del Soccorso",
        "subtitle": "- La nostra parrocchia, casa di preghiera e di fede -",
        "welcome": "Benvenuti nella nostra parrocchia",
        "motto": "« Nostra Signora del Soccorso, prega per noi »",
        "toggle": "العربية",
        "cards": [
          [
            "Orari delle Messe",
            "e Attività",
            "assets/icons/icon-calendar.png"
          ],
          [
            "Santo Rosario",
            "Inizia la preghiera",
            "assets/icons/icon-rosary.png"
          ],
          [
            "Biblioteca delle Preghiere",
            "Audio e Testo",
            "assets/icons/icon-bible.png"
          ],
          [
            "Messaggi del Sacerdote",
            "e Notizie Parrocchiali",
            "assets/icons/icon-megaphone.png"
          ],
          [
            "Vita Parrocchiale",
            "e Attività",
            "assets/icons/icon-church.png"
          ],
          [
            "Intenzioni di Preghiera",
            "Preghiamo insieme",
            "assets/icons/icon-praying-hands.png"
          ]
        ],
        "nav": [
          "Home",
          "Notifiche",
          "Preferiti",
          "Informazioni"
        ]
      }
    }

    const supportedLanguages = ['ar', 'fr', 'it'];
    let currentLang = localStorage.getItem('parish-language');
    if (!supportedLanguages.includes(currentLang)) currentLang = 'ar';

    function render() {
      const t = translations[currentLang];
      document.title = t.title;
      document.documentElement.lang = currentLang;
      document.documentElement.dir = t.dir;
      document.getElementById('app-title').textContent = t.title;
      document.getElementById('app-subtitle').textContent = t.subtitle;
      document.getElementById('welcome-text').textContent = t.welcome;
      document.getElementById('motto-text').textContent = t.motto;
      document.getElementById('lang-toggle').textContent = t.toggle;

      document.getElementById('cards-container').innerHTML = t.cards.map((c, cardIndex) => `
        <div class="card" role="button" tabindex="0" onclick="openFeature(cardIndex)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openFeature(cardIndex)}">
          <img src="${c[2]}" alt="${c[0]}" />
          <div class="card-text">
            <h3>${c[0]}</h3>
            <p>${c[1]}</p>
          </div>
        </div>
      `).join('');

      const navIcons = ['nav-home.png', 'nav-bell.png', 'nav-star.png', 'nav-info.png'];
      document.getElementById('bottom-nav').innerHTML = t.nav.map((label, index) => `
        <div class="nav-item ${index === 0 ? 'active' : ''}">
          <img src="assets/icons/${navIcons[index]}" alt="" />
          <span>${label}</span>
        </div>
      `).join('');
    }

    function toggleLang() {
      const currentIndex = supportedLanguages.indexOf(currentLang);
      currentLang = supportedLanguages[(currentIndex + 1) % supportedLanguages.length];
      localStorage.setItem('parish-language', currentLang);
      render();
      if (document.getElementById('mass-screen').classList.contains('visible')) renderMassScreen();
      if (document.getElementById('rosary-screen').classList.contains('visible')) renderRosary();
    }

    render();
    const massLabels={
      ar:{title:'مواعيد القداديس والنشاطات',back:'رجوع',tabs:['القداديس','القداديس الخاصة','النشاطات'],empty:'لم تُضف الرعية المواعيد بعد. يرجى العودة لاحقاً للاطلاع على المعلومات المؤكدة.',loading:'جارٍ تحميل المواعيد…',error:'تعذّر تحميل المواعيد حالياً. يرجى المحاولة لاحقاً.'},
      fr:{title:'Horaires des Messes et Activités',back:'Retour',tabs:['Messes','Messes spéciales','Activités'],empty:'La paroisse n’a pas encore publié les horaires. Revenez plus tard pour consulter les informations confirmées.',loading:'Chargement des horaires…',error:'Impossible de charger les horaires pour le moment.'},
      it:{title:'Orari delle Messe e Attività',back:'Indietro',tabs:['Messe','Messe speciali','Attività'],empty:'La parrocchia non ha ancora pubblicato gli orari. Torna più tardi per consultare le informazioni confermate.',loading:'Caricamento degli orari…',error:'Impossibile caricare gli orari al momento.'}
    };
    let massTab=0,massData=null;
    function openFeature(index){if(index!==0)return;document.getElementById('home-view').classList.add('hidden');document.getElementById('mass-screen').classList.add('visible');document.getElementById('bottom-nav').style.display='none';renderMassScreen();loadMassData();}
    function closeFeature(){document.getElementById('mass-screen').classList.remove('visible');document.getElementById('home-view').classList.remove('hidden');document.getElementById('bottom-nav').style.display='grid';}
    async function loadMassData(){const labels=massLabels[currentLang];document.getElementById('mass-content').innerHTML='<p class="empty-state">'+labels.loading+'</p>';try{const response=await fetch('src/data/mass-schedule.json',{cache:'no-store'});if(!response.ok)throw new Error('request failed');massData=await response.json();renderMassContent();}catch(e){document.getElementById('mass-content').innerHTML='<p class="empty-state">'+labels.error+'</p>';}}
    function renderMassScreen(){const labels=massLabels[currentLang];document.getElementById('mass-title').textContent=labels.title;document.getElementById('mass-back').textContent=labels.back;document.getElementById('mass-tabs').innerHTML=labels.tabs.map((label,index)=>'<button class="feature-tab '+(index===massTab?'active':'')+'" onclick="selectMassTab('+index+')">'+label+'</button>').join('');renderMassContent();}
    function selectMassTab(index){massTab=index;renderMassScreen();}
    function renderMassContent(){const labels=massLabels[currentLang];if(!massData){document.getElementById('mass-content').innerHTML='<p class="empty-state">'+labels.loading+'</p>';return;}const entries=massData[['massSchedule','specialMasses','activities'][massTab]]||[];if(!entries.length){document.getElementById('mass-content').innerHTML='<p class="empty-state">'+labels.empty+'</p>';return;}document.getElementById('mass-content').innerHTML=entries.map(item=>'<article class="schedule-entry"><strong>'+escapeHtml(item['title'+currentLang.toUpperCase()]||item.title||item.label||'')+'</strong><p>'+escapeHtml(item['description'+currentLang.toUpperCase()]||item.description||'')+'</p></article>').join('');}
    function escapeHtml(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    const rosaryLabels={
      ar:{title:'المسبحة الوردية',back:'رجوع',choose:'اختر أسرار المسبحة',days:'الأيام',start:'ابدأ هذا السر',step:'السر',of:'من',previous:'السابق',next:'التالي',again:'العودة إلى الأسرار',unavailable:'النص الكامل للصلاة والتسجيلات الصوتية سيضافان بعد مراجعتهما واعتمادهما من الرعية.',noAudio:'لا توجد تسجيلات صوتية معتمدة بعد. يمكنك المتابعة يدوياً.',dayNames:['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']},
      fr:{title:'Le Saint Rosaire',back:'Retour',choose:'Choisissez les mystères du Rosaire',days:'Jours',start:'Commencer ces mystères',step:'Mystère',of:'sur',previous:'Précédent',next:'Suivant',again:'Retour aux mystères',unavailable:'Le texte intégral des prières et les enregistrements seront ajoutés après vérification et approbation de la paroisse.',noAudio:'Aucun enregistrement approuvé pour le moment. Vous pouvez continuer en mode manuel.',dayNames:['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi']},
      it:{title:'Santo Rosario',back:'Indietro',choose:'Scegli i misteri del Rosario',days:'Giorni',start:'Inizia questi misteri',step:'Mistero',of:'di',previous:'Precedente',next:'Successivo',again:'Torna ai misteri',unavailable:'Il testo completo delle preghiere e le registrazioni saranno aggiunti dopo la verifica e l’approvazione della parrocchia.',noAudio:'Non ci sono ancora registrazioni approvate. Puoi continuare in modalità manuale.',dayNames:['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato']}
    };
    let rosaryData=null,selectedMystery=0,rosaryEpisode=0,rosaryStarted=false;
    function openFeature(index){
      if(index===0){document.getElementById('home-view').classList.add('hidden');document.getElementById('mass-screen').classList.add('visible');document.getElementById('bottom-nav').style.display='none';renderMassScreen();loadMassData();return;}
      if(index===1){document.getElementById('home-view').classList.add('hidden');document.getElementById('rosary-screen').classList.add('visible');document.getElementById('bottom-nav').style.display='none';loadRosary();return;}
    }
    function closeRosary(){document.getElementById('rosary-screen').classList.remove('visible');document.getElementById('home-view').classList.remove('hidden');document.getElementById('bottom-nav').style.display='grid';}
    async function loadRosary(){const box=document.getElementById('rosary-content');box.textContent=rosaryLabels[currentLang].noAudio;try{const response=await fetch('src/data/rosary.json',{cache:'no-store'});if(!response.ok)throw new Error('request failed');rosaryData=await response.json();renderRosary();}catch(e){box.textContent=rosaryLabels[currentLang].unavailable;}}
    function renderRosary(){const l=rosaryLabels[currentLang];document.getElementById('rosary-title').textContent=l.title;document.getElementById('rosary-back').textContent=l.back;const box=document.getElementById('rosary-content');if(!rosaryData){box.textContent=l.unavailable;return;}
      if(!rosaryStarted){box.innerHTML='<p class="empty-state">'+l.choose+'</p><div class="rosary-mysteries">'+rosaryData.mysteries.map((m,i)=>'<button class="mystery-choice '+(i===selectedMystery?'active':'')+'" onclick="selectRosaryMystery('+i+')">'+escapeHtml(m.name[currentLang]||m.name.ar)+'<small>'+l.days+': '+escapeHtml(m.days.map(day=>l.dayNames[['sunday','monday','tuesday','wednesday','thursday','friday','saturday'].indexOf(day)]).join(', '))+'</small></button>').join('')+'</div><p class="empty-state">'+l.noAudio+'</p><button class="feature-tab" style="width:100%" onclick="startRosary()">'+l.start+'</button>';return;}
      const m=rosaryData.mysteries[selectedMystery],episode=m.episodes[rosaryEpisode],progress=((rosaryEpisode+1)/5)*100;
      box.innerHTML='<div class="rosary-step"><p>'+l.step+' '+(rosaryEpisode+1)+' '+l.of+' 5</p><div class="rosary-progress"><span style="width:'+progress+'%"></span></div><h3>'+escapeHtml(m.name[currentLang]||m.name.ar)+'</h3><p>'+escapeHtml(episode[currentLang]||episode.ar)+'</p><p style="margin-top:14px">'+l.unavailable+'</p></div><div class="rosary-controls"><button class="feature-tab" onclick="moveRosary(-1)">'+l.previous+'</button><button class="feature-tab" onclick="moveRosary(1)">'+(rosaryEpisode===4?l.again:l.next)+'</button></div>';}
    function selectRosaryMystery(index){selectedMystery=index;renderRosary();}
    function startRosary(){rosaryStarted=true;rosaryEpisode=0;renderRosary();}
    function moveRosary(direction){rosaryEpisode+=direction;if(rosaryEpisode>4||rosaryEpisode<0){rosaryStarted=false;rosaryEpisode=0;}renderRosary();}
  </script>
</body>
</html>
