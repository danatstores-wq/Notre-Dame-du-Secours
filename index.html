<!DOCTYPE html>

    (function () {

        var viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) viewport.setAttribute("content", "width=device-width, initial-scale=1, viewport-fit=cover");

  <title>كنيسة سيدة المعونات | Église Notre-Dame du Secours</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-light: #fff0b3;
      --gold: #e5b657;
      --gold-dark: #a87424;
      --navy-card: rgba(11, 29, 58, 0.86);
      --navy-nav: #07152c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #12294a;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    html[lang="fr"] body,
    html[lang="it"] body {
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app-shell {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      background-color: transparent;
      background-image: url('assets/backgrounds/bg.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    .home-view {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 0;
    }
    .emblem { width: 58px; height: 58px; }
    .header-title {
      text-align: center;
      flex: 1;
      padding: 0 6px;
    }
    .header-title h1 {
      font-family: 'Amiri', 'Playfair Display', serif;
      font-size: 1.65rem;
      line-height: 1.2;
      color: var(--gold-light);
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    }
    .header-title p {
      font-size: 0.78rem;
      color: #f3e5c0;
      margin-top: 4px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }
    .top-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .lang-btn {
      background: rgba(11, 29, 58, 0.8);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .hero-spacer { flex: 1 1 auto; min-height: 0; }
    .welcome-banner {
      text-align: center;
      padding: 0 16px 12px;
    }
    .welcome-banner h2 {
      font-family: 'Amiri', 'Playfair Display', serif;
      font-size: 1.55rem;
      color: var(--gold-light);
      text-shadow: 0 2px 12px rgba(0,0,0,0.95);
    }
    .welcome-banner p {
      font-size: 0.9rem;
      color: #f5e6c4;
      margin-top: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.95);
    }
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 6px 24px 12px;
    }
    .divider span {
      height: 1px;
      flex: 1;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }
    .divider img { width: 20px; height: 20px; }
    .cards-grid {
      display: grid;
      margin-top: auto;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 14px 40px;
    }
    .card {
      background: linear-gradient(145deg, rgba(16, 42, 82, 0.92), rgba(7, 20, 43, 0.95));
      border: 1.5px solid var(--gold);
      border-radius: 18px;
      padding: 12px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,240,179,0.25);
      transition: transform 0.15s ease;
    }
    .card:active { transform: scale(0.98); }
    .card > img {
      display: block;
      width: 40px !important;
      min-width: 40px;
      max-width: 40px;
      height: 40px !important;
      min-height: 40px;
      max-height: 40px;
      flex: 0 0 40px;
      object-fit: contain;
      object-position: center;
    }
    .card-text { flex: 1; }
    .card-text h3 { font-size: 0.85rem; color: #fff; line-height: 1.25; }
    .card-text p { font-size: 0.72rem; color: #d8c396; margin-top: 2px; }
    .feature-screen{display:none;padding:18px 16px 24px;min-height:55vh}
    .bible-language-grid{display:grid;grid-template-columns:1fr;gap:9px;margin:12px 0 18px}
    .bible-language{width:100%;padding:14px;border:1px solid var(--gold);border-radius:13px;background:linear-gradient(145deg,rgba(16,42,82,.94),rgba(7,20,43,.96));color:var(--gold-light);font:inherit;font-weight:700;text-align:start}
    .bible-reader{margin-top:12px}.bible-controls{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:12px 0}
    .bible-controls select{min-width:0;width:100%;padding:11px;border-radius:10px;border:1px solid var(--gold);background:#102a52;color:#fff;font:inherit}
    .bible-verses{padding:12px 8px;color:#fff;line-height:1.85}
    .bible-chapter-title{color:var(--gold-light);text-align:center;margin:10px 0 18px}
    .bible-verse{margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid rgba(229,182,87,.15)}
    .bible-verse sup{color:var(--gold-light);font-size:.75em;margin-inline-end:5px}
    .bible-link{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0;padding:16px;border:1px solid var(--gold);border-radius:14px;background:linear-gradient(145deg,rgba(16,42,82,.94),rgba(7,20,43,.96));color:var(--gold-light);text-decoration:none;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
    .bible-link small{display:block;margin-top:4px;color:#e5d8bd;font-weight:400}
    .bible-note{line-height:1.7;color:#e5d8bd;margin:10px 2px 16px;font-size:.9rem}
    .feature-screen.visible{display:block;flex:1 1 auto;min-height:0;max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}.home-view.hidden{display:none}
    .screen-heading{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .screen-heading h2{color:var(--gold-light);font-size:1.15rem}
    .back-btn,.feature-tab{border:1px solid var(--gold);background:rgba(11,29,58,.85);color:var(--gold-light);border-radius:12px;padding:9px 13px;font:inherit;cursor:pointer}
    .feature-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}
    .feature-tab{padding:9px 4px;font-size:.78rem}.feature-tab.active{background:var(--gold);color:#081833;font-weight:700}
    .feature-content{background:rgba(11,29,58,.78);border:1px solid rgba(229,182,87,.65);border-radius:16px;padding:16px;min-height:120px}
    .empty-state{text-align:center;color:#f3e5c0;line-height:1.8;padding:18px 4px}
    .schedule-entry{padding:12px 4px;border-bottom:1px solid rgba(229,182,87,.25)}
    .rosary-mysteries{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
    .rosary-mystery-list{display:grid;gap:14px;margin:14px 0;text-align:start}
    .rosary-mystery-text{padding:0 4px}
    .rosary-mystery-text h3{color:var(--gold-light);font-size:1rem;margin:0 0 5px}
    .rosary-mystery-text ol{margin:0;padding-inline-start:24px;line-height:1.8}
    .mystery-icon{display:block;font-size:1.5rem;line-height:1.2;margin:0 auto 5px}.mystery-icon svg{display:block;width:32px;height:32px;margin:0 auto;color:var(--gold-light)}
    .mystery-choice strong{display:block;color:var(--gold-light);font-size:.86rem}
    .mystery-episodes{margin:6px 0;padding-inline-start:20px;text-align:start;font-size:.72rem;line-height:1.45}
    .mystery-episodes li{margin:2px 0}
    .mystery-choice small{display:block;color:#e8d5a9;margin-top:6px;font-size:.64rem;line-height:1.25}
    .mystery-choice{background:rgba(11,29,58,.9);border:1px solid var(--gold);border-radius:10px;padding:7px 5px;color:#fff;text-align:center;font:inherit;font-size:.82rem;line-height:1.25;cursor:pointer}
    .mystery-choice.active{background:rgba(229,182,87,.22);box-shadow:0 0 0 1px var(--gold) inset}
    .mystery-choice small{display:block;color:#e8d5a9;margin-top:3px;font-size:.64rem;line-height:1.25}
    .rosary-progress{height:7px;background:#263b5b;border-radius:9px;overflow:hidden;margin:12px 0}
    .rosary-progress span{display:block;height:100%;background:var(--gold);width:0}
    .rosary-audio-progress{height:6px;background:#263b5b;border-radius:9px;overflow:hidden;margin:6px 0 3px}
    .rosary-audio-progress span{display:block;height:100%;width:0;background:#58c7d9;transition:width .12s linear}
    .rosary-audio-time{display:flex;justify-content:space-between;gap:8px;color:#cbd7e8;font-size:.75rem;margin-bottom:8px}
    .rosary-controls{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
    .rosary-controls button{flex:1}.rosary-step{text-align:center;padding:18px 6px;line-height:1.8}.rosary-step h3{color:var(--gold-light);margin-bottom:8px}
    .rosary-guide{text-align:center;line-height:1.8}
    .rosary-guide-step{padding:18px 8px;margin:12px 0;border:1px solid rgba(229,182,87,.45);border-radius:14px;background:rgba(7,20,43,.45)}
    .rosary-guide-step h3{color:var(--gold-light);font-size:1.12rem;margin:8px 0}
    .rosary-guide-meta{color:#e8d5a9;font-size:.82rem}
    .rosary-decade-dots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:14px auto;max-width:260px}
    .rosary-decade-dots span{width:13px;height:13px;border-radius:50%;border:1px solid var(--gold);background:rgba(229,182,87,.12)}
    .rosary-decade-dots span.done{background:var(--gold)}
    .rosary-decade-dots span.current{outline:2px solid var(--gold-light);outline-offset:2px}
    .rosary-guide-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .rosary-guide-actions button{flex:1;min-width:100px}

    .rosary-diagram{margin:4px auto 12px;width:100%;max-width:500px;padding:4px 2px;border:1px solid rgba(229,182,87,.42);border-radius:16px;background:rgba(7,20,43,.42);box-shadow:0 5px 18px rgba(0,0,0,.22)}
    .rosary-diagram svg{display:block;width:100%;height:auto;max-height:none;overflow:visible}
    .rosary-diagram .decade-bead{fill:url(#pearlBead);stroke:#a77a3b;stroke-width:1;transition:fill .25s,filter .25s}
    .rosary-diagram .decade-bead.done{fill:url(#doneBead);filter:url(#rosaryGlowSoft)}
    .rosary-diagram .decade-bead.current{fill:url(#doneBead);stroke:#fff;stroke-width:2;filter:url(#rosaryGlow)}
    .rosary-diagram .opening-bead{fill:url(#pearlBead);stroke:#a77a3b;stroke-width:1}
    .rosary-diagram .opening-large-bead{fill:url(#goldBead);stroke:#8e672f;stroke-width:1.2}.rosary-diagram .opening-large-bead.done{fill:url(#doneBead);filter:url(#rosaryGlowSoft)}.rosary-diagram .opening-large-bead.current{fill:url(#doneBead);stroke:#fff;stroke-width:2;filter:url(#rosaryGlow)}
    .rosary-diagram .opening-bead.done{fill:url(#doneBead);filter:url(#rosaryGlowSoft)}
    .rosary-diagram .opening-bead.current{fill:url(#doneBead);stroke:#fff;stroke-width:2;filter:url(#rosaryGlow)}
    .rosary-diagram .separator-bead{fill:url(#goldBead);stroke:#fff0c5;stroke-width:1.2;filter:url(#rosaryGlowSoft)}.rosary-diagram .separator-bead.done{fill:url(#doneBead);filter:url(#rosaryGlowSoft)}.rosary-diagram .separator-bead.current{fill:url(#doneBead);stroke:#fff;stroke-width:2;filter:url(#rosaryGlow)}
    .rosary-diagram .bead-shine{fill:rgba(255,255,255,.52);stroke:rgba(255,255,255,.28);stroke-width:.35;pointer-events:none}
    .rosary-diagram .bead-glint{fill:#fff;opacity:.8;pointer-events:none;filter:drop-shadow(0 0 1px #fff)}
    .rosary-diagram .decade-bead,.rosary-diagram .opening-bead,.rosary-diagram .opening-large-bead,.rosary-diagram .separator-bead{filter:url(#beadShadow)}
    .rosary-diagram .rosary-cord{fill:none;stroke:url(#cordGold);stroke-width:3.2;stroke-linecap:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
    .rosary-diagram .medal-rim{fill:url(#goldBead);stroke:#fff0bd;stroke-width:1.5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
    .rosary-diagram .medal-center{fill:#263d60;stroke:#f8dfa0;stroke-width:1.3}
    .rosary-diagram .medal-mark{fill:none;stroke:#f8dfa0;stroke-width:1.2;stroke-linecap:round}
    .rosary-diagram .rosary-crucifix path{fill:none;stroke:url(#crossGold);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
    .rosary-diagram .rosary-crucifix .cross-highlight{stroke:#fff0bd;stroke-width:1.2;opacity:.8;filter:none}
    .rosary-diagram .rosary-cord{fill:none;stroke:#9b7542;stroke-width:2.1;opacity:.95;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
    .rosary-diagram .rosary-cross{fill:none;stroke:#d8bd82;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
    .rosary-diagram .rosary-medal{fill:url(#goldBead);stroke:#f5d58a;stroke-width:1.6}
    .rosary-diagram .medal-center{fill:#31476a;stroke:#f4d58a;stroke-width:1}
    .rosary-diagram .rosary-diagram-label{fill:#f3e5c0;font-size:10px;text-anchor:middle}

    .rosary-recommendation{border:1px solid rgba(229,182,87,.55);border-radius:12px;padding:11px;margin:10px 0;color:#f3e5c0;background:rgba(229,182,87,.08);line-height:1.7}

    .prayer-search{display:block;width:100%;margin:0 0 16px;padding:12px 14px;border:1px solid rgba(229,182,87,.7);border-radius:12px;background:rgba(7,20,43,.85);color:#fff;font:inherit;direction:inherit}.prayer-reader-tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.prayer-reader-tools .feature-tab{flex:1;min-width:64px}
    .prayer-audio-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.prayer-audio-controls .feature-tab{flex:1;min-width:88px}.prayer-audio-status{min-height:1.5em;color:#f3e5c0;font-size:.82rem;margin:6px 2px 12px}
    .prayer-category{margin-bottom:14px}.prayer-category-heading{display:flex;align-items:center;gap:10px;margin-bottom:9px}.prayer-category-heading h3{color:var(--gold-light);margin:0}.prayer-category-icon{width:36px;height:36px;object-fit:contain;flex:0 0 36px}.prayer-choice{display:block;width:100%;text-align:start;background:rgba(11,29,58,.9);border:1px solid rgba(229,182,87,.55);border-radius:12px;color:#fff;padding:12px;margin:7px 0;font:inherit;cursor:pointer}.prayer-text{white-space:pre-wrap;line-height:2;text-align:start;padding:14px 4px;color:#fff}.prayer-audio-note{color:#e8d5a9;font-size:.82rem;margin-top:12px}
    .candle-panel{text-align:center;line-height:1.7;max-width:560px;margin:0 auto;padding:4px 0 28px}.candle-intro{color:#f0e5cd;margin:8px auto 14px;max-width:440px}.candle-orbit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3, minmax(82px,auto));gap:7px;align-items:center;justify-items:center;max-width:430px;margin:10px auto 16px;direction:ltr}.candle-intention{width:100%;min-height:70px;border:1px solid rgba(224,190,125,.45);border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(255,245,210,.12),rgba(11,25,48,.94) 70%);color:#f4e8ce;font:inherit;font-size:clamp(.68rem,2.7vw,.86rem);line-height:1.35;padding:7px 4px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 3px 12px #0003;transition:all .45s}.candle-intention.active{background:radial-gradient(circle,#fff0b5 0%,#e7a94b 40%,#8c5520 100%);color:#301b0a;border-color:#ffe4a1;box-shadow:0 0 22px #ffc45c;transform:scale(1.06)}.candle-intention.done{border-color:#d9b66f;color:#f6d78d;background:radial-gradient(circle,rgba(214,166,79,.3),rgba(11,25,48,.95))}.candle-center{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;min-height:125px;position:relative}.candle-art{height:126px;width:48px;position:relative;display:flex;align-items:flex-end;justify-content:center;transition:height .8s}.candle-wax{height:112px;width:43px;border-radius:8px 8px 5px 5px;background:linear-gradient(90deg,#b77b39 0%,#f5dfad 22%,#fff0c9 48%,#d3a15c 82%,#98602d 100%);box-shadow:inset 4px 0 7px #fff8, inset -5px 0 8px #7c451c66,0 7px 12px #0006;position:relative;transition:height .8s;border-bottom:3px solid #a56b35}.candle-wax:before{content:"";position:absolute;top:-4px;left:0;width:100%;height:12px;border-radius:50%;background:linear-gradient(90deg,#d9b77d,#fff0c9,#bd8b4e)}.candle-wick{position:absolute;top:-12px;left:50%;width:3px;height:13px;background:#49301c;transform:translateX(-50%);z-index:2}.candle-flame{position:absolute;top:-48px;left:50%;width:19px;height:39px;transform:translateX(-50%);border-radius:55% 55% 50% 50%;background:radial-gradient(ellipse at 50% 72%,#fffbd5 0 18%,#ffe27a 38%,#ff9d32 68%,#e85c19 100%);filter:drop-shadow(0 0 9px #ffb43e) drop-shadow(0 0 22px #ff9b2c);animation:candle-flicker 1.25s ease-in-out infinite alternate;opacity:0;transition:opacity .4s}.candle-art.lit .candle-flame{opacity:1}.candle-art.out .candle-flame{opacity:0}.candle-art.out .candle-wax{filter:brightness(.75)}@keyframes candle-flicker{from{transform:translateX(-50%) rotate(-3deg) scale(.96)}to{transform:translateX(-50%) rotate(3deg) scale(1.04)}}.candle-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px auto}.candle-controls button{min-width:145px}.candle-status{min-height:2.8em;color:var(--gold-light);margin:8px auto;max-width:430px}.candle-progress{height:6px;max-width:360px;margin:12px auto;background:#ffffff20;border-radius:9px;overflow:hidden}.candle-progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#c88c3d,#ffe4a1);transition:width .5s}.candle-lit-message{color:var(--gold-light);margin:12px 0}@media(max-width:360px){.candle-orbit{gap:4px;grid-template-rows:repeat(3,minmax(74px,auto))}.candle-intention{min-height:64px;padding:5px 2px;font-size:.64rem}.candle-center{min-height:110px}.candle-art{transform:scale(.88)}}.faith-topic{margin:9px 0;border:1px solid rgba(229,182,87,.5);border-radius:12px;background:rgba(7,20,43,.45);padding:12px}.faith-topic summary{color:var(--gold-light);font-weight:700;cursor:pointer}.faith-topic p{line-height:1.8;margin-top:9px}
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 430px);
      min-height: 68px;
      z-index: 10000;
      background: var(--navy-nav);
      border-top: 1.5px solid var(--gold);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      padding: 8px 4px calc(12px + env(safe-area-inset-bottom, 0px));
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      visibility: visible;
      opacity: 1;
    }
    /* Android system navigation bar occupies the bottom edge of the screen.
       Keep the parish menu immediately above it instead of underneath it. */

    .android-device .home-view { padding-bottom: 104px; }
    .dashboard-card-icon { width:40px; height:40px; object-fit:contain; flex:0 0 40px; display:block; }
    .bottom-nav img { width:24px; height:24px; object-fit:contain; display:block; }
    .home-view { padding-bottom: 72px; }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #d8c396;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .nav-item.active { color: var(--gold-light); font-weight: 700; }
    .nav-item img { width: 24px; height: 24px; }
    .nav-profile-icon { width:24px; height:24px; object-fit:contain; display:block; }

    const supportedLanguages = ['ar', 'fr', 'it', 'en'];
    let currentLang = localStorage.getItem('parish-language');
    if (!supportedLanguages.includes(currentLang)) currentLang = 'ar';

    function render() {
      const t = translations[currentLang];
      document.title = t.title;
      document.documentElement.lang = currentLang;
      document.documentElement.dir = t.dir;
      document.getElementById('app-title').textContent = t.title;
      document.getElementById('app-subtitle').textContent = t.subtitle;
      document.getElementById('welcome-text').textContent = t.welcome;
      document.getElementById('motto-text').textContent = t.motto;

      document.getElementById('cards-container').innerHTML = t.cards.map((c, cardIndex) => `
        <div class="card" role="button" tabindex="0" onclick="${cardIndex===6?'window.openBible()':'openFeature('+cardIndex+')'}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${cardIndex===6?'window.openBible()':'openFeature('+cardIndex+')'}}">
          ${c[2].startsWith("assets/")?`<img class="dashboard-card-icon" src="${c[2]}" alt="${c[0]}" width="40" height="40" style="display:block;width:40px!important;height:40px!important;min-width:40px;min-height:40px;max-width:40px;max-height:40px;object-fit:contain;flex:0 0 40px" />`:`<span class="card-symbol" aria-hidden="true">${c[2]}</span>`}
          <div class="card-text">
            <h3>${c[0]}</h3>
            <p>${c[1]}</p>
          </div>
        </div>
      `).join('');

      const navIcons = ['nav-home.png', 'nav-bell.png', 'nav-star.png', 'nav-info.png'];
      document.getElementById('bottom-nav').innerHTML = t.nav.map((label, index) => {
        const icon = index < navIcons.length ? `<img src="assets/icons/${navIcons[index]}" alt="" />` : '<img class="nav-profile-icon" src="assets/icons/profile.png" alt="" />';
        return `<div class="nav-item ${index === 0 ? 'active' : ''}" role="button" tabindex="0" aria-label="${label}" onclick="handleNav(${index})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handleNav(${index})}">${icon}<span>${label}</span></div>`;
      }).join('');
    }

    function positionLanguageMenu(){
      const menu=document.getElementById('language-dropdown'),button=document.getElementById('language-menu-button');
      if(!menu||!button||menu.hidden)return;
      const rect=button.getBoundingClientRect(),gap=8,pad=8;
      const width=Math.min(Math.max(menu.scrollWidth,150),window.innerWidth-pad*2);
      const left=Math.max(pad,Math.min(rect.right-width,window.innerWidth-width-pad));
      menu.style.width=width+'px';menu.style.left=left+'px';menu.style.right='auto';
      const height=menu.offsetHeight;
      const top=Math.max(pad,Math.min(rect.bottom+gap,window.innerHeight-height-pad));
      menu.style.top=top+'px';
    }
    function toggleLanguageMenu(event){

function playCandlePrayer(url,token){
 return new Promise((resolve,reject)=>{
  if(token!==candlePlaybackToken)return reject(new Error("stopped"));
  const audio=new Audio(url);candleCurrentAudio=audio;audio.preload="auto";
  const cleanup=()=>{audio.removeEventListener("ended",ended);audio.removeEventListener("error",failed);};
  const ended=()=>{cleanup();if(candleCurrentAudio===audio)candleCurrentAudio=null;resolve();};
  const failed=()=>{cleanup();if(candleCurrentAudio===audio)candleCurrentAudio=null;reject(new Error("audio"))};
  audio.addEventListener("ended",ended,{once:true});audio.addEventListener("error",failed,{once:true});
  audio.play().catch(err=>{cleanup();if(candleCurrentAudio===audio)candleCurrentAudio=null;reject(err);});
 });
}

    function fetchBibleAsset(path,options){

            const request=new XMLHttpRequest();
            request.open('GET',new URL(path,document.baseURI).href,true);
            request.onload=()=>{
              if((request.status>=200&&request.status<300)||request.status===0){
                try{
                  const data=JSON.parse(request.responseText);

              }else reject(new Error('Bible asset unavailable ('+request.status+'): '+path));
            };
            request.onerror=()=>reject(new Error('Could not read bundled Bible asset: '+path));
            request.send();
          }catch(error){reject(error);}
        });
      }
      return fetch(path,options);
    }

    async function fetchEnglishBibleAsset(relativePath){
      const localPath=EN_BIBLE_BASE+relativePath;
      let errors=[];
      // In Android's file-based WebView, prefer the HTTPS copy to avoid file-URL XHR quirks; keep the bundled copy as offline fallback.
      if(location.protocol==='file:'){
        try{const remote=await fetch(EN_BIBLE_REMOTE_BASE+relativePath,{cache:'no-store'});if(remote.ok)return remote;errors.push('Online source HTTP '+remote.status);}
        catch(error){errors.push('Online source: '+(error&&error.message?error.message:'failed'));}
        try{const local=await fetchBibleAsset(localPath);if(local&&local.ok)return local;errors.push('Bundled file unavailable: '+relativePath);}
        catch(error){errors.push('Bundled file: '+(error&&error.message?error.message:'failed'));}
      }else{
        try{const local=await fetchBibleAsset(localPath);if(local&&local.ok)return local;errors.push('Site file unavailable: '+relativePath);}
        catch(error){errors.push('Site file: '+(error&&error.message?error.message:'failed'));}
        try{const remote=await fetch(EN_BIBLE_REMOTE_BASE+relativePath,{cache:'no-store'});if(remote.ok)return remote;errors.push('Online source HTTP '+remote.status);}
        catch(error){errors.push('Online source: '+(error&&error.message?error.message:'failed'));}
      }
      throw new Error('English Bible data unavailable — '+errors.join('; '));
    }

    async function getArabicBookData(bookMeta){

          chapterNumber:Number(ch.chapter||ch.chapterNumber||ci+1),
          verses:ch.verses.map((v,vi)=>({

      const originalText=button.textContent;
      button.disabled=true;
      try{
        const response=await fetch(imageUrl,{mode:'cors'});
        if(!response.ok)throw new Error('Image download failed');
        const blob=await response.blob();
        const file=new File([blob],'parish-photo.'+((blob.type.split('/')[1]||'jpg').replace('jpeg','jpg')),{type:blob.type||'image/jpeg'});
        if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:'Notre-Dame-du-Secours'});
        }else{
          window.open(imageUrl,'_blank','noopener');
        }
      }catch(error){
        if(error&&error.name==='AbortError')return;
        window.open(imageUrl,'_blank','noopener');
      }finally{
        button.disabled=false;
        button.textContent=originalText;
      }
    });

 if(!file||!file.type.startsWith("image/")||file.size>8*1024*1024)throw new Error("Each photo must be an image no larger than 8 MB.");
 const idToken=await currentUser.getIdToken(true);
 const authResponse=await fetch(IMAGEKIT_UPLOAD_AUTH_URL,{method:"POST",headers:{Authorization:"Bearer "+idToken}});
 const authData=await authResponse.json().catch(()=>({}));
 if(!authResponse.ok)throw new Error(authData.error||authData.message||"Image upload authorization failed ("+authResponse.status+").");
 if(!authData.token||!authData.expire||!authData.signature||!authData.publicKey)throw new Error("The upload authorization response is incomplete.");
 const form=new FormData(),safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 form.append("file",file);form.append("fileName",Date.now()+"-"+safeName);
 form.append("folder","/parish-media");form.append("useUniqueFileName","true");
 const tags=[];
 if(section==="activities"&&/^\d{4}-\d{2}-\d{2}$/.test(dateValue||"")){
  const d=new Date(dateValue+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+30);
  tags.push("parish_delete_after_"+d.toISOString().slice(0,10).replace(/-/g,""));
 }
 form.append("tags",JSON.stringify(tags));
 form.append("token",authData.token);form.append("expire",String(authData.expire));
 form.append("signature",authData.signature);form.append("publicKey",authData.publicKey);
 const uploadResponse=await fetch("https://upload.imagekit.io/api/v1/files/upload",{method:"POST",body:form});
 const uploadData=await uploadResponse.json().catch(()=>({}));
 if(!uploadResponse.ok)throw new Error(uploadData.message||uploadData.help||"ImageKit upload failed ("+uploadResponse.status+").");
 if(!uploadData.url||!uploadData.fileId)throw new Error("ImageKit did not return the photo URL and file ID.");
 return {url:uploadData.url,fileId:uploadData.fileId,name:uploadData.name||file.name};
}
async function deleteUnreferencedImageKitFiles(){
 if(!pendingImageKitDeletes.length||!isAdmin(currentUser))return;
 const idToken=await currentUser.getIdToken(true),queue=pendingImageKitDeletes.slice();
 for(const file of queue){
  const response=await fetch(IMAGEKIT_DELETE_URL,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+idToken},body:JSON.stringify(file)});
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(result.error||"ImageKit deletion check failed ("+response.status+").");
  pendingImageKitDeletes=pendingImageKitDeletes.filter(x=>x.fileId!==file.fileId);
 }
}
