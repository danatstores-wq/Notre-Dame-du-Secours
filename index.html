<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كنيسة سيدة المعونات | Église Notre-Dame du Secours</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-light: #fff0b3;
      --gold: #e5b657;
      --gold-dark: #a87424;
      --navy-card: rgba(11, 29, 58, 0.86);
      --navy-nav: #07152c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050e1d;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    html[lang="fr"] body,
    html[lang="it"] body {
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: #081833;
      background-image: linear-gradient(to bottom, rgba(8,24,51,0.15) 0%, rgba(8,24,51,0.65) 48%, #081833 62%), url('assets/backgrounds/bg.jpg');
      background-size: 100% auto;
      background-repeat: no-repeat;
      background-position: top center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 18px 16px 0;
    }
    .emblem { width: 58px; height: 58px; }
    .header-title {
      text-align: center;
      flex: 1;
      padding: 0 6px;
    }
    .header-title h1 {
      font-family: 'Amiri', 'Playfair Display', serif;
      font-size: 1.65rem;
      line-height: 1.2;
      color: var(--gold-light);
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    }
    .header-title p {
      font-size: 0.78rem;
      color: #f3e5c0;
      margin-top: 4px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }
    .top-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .lang-btn {
      background: rgba(11, 29, 58, 0.8);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .hero-spacer { height: 210px; }
    .welcome-banner {
      text-align: center;
      padding: 0 16px 12px;
    }
    .welcome-banner h2 {
      font-family: 'Amiri', 'Playfair Display', serif;
      font-size: 1.55rem;
      color: var(--gold-light);
      text-shadow: 0 2px 12px rgba(0,0,0,0.95);
    }
    .welcome-banner p {
      font-size: 0.9rem;
      color: #f5e6c4;
      margin-top: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.95);
    }
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 6px 24px 12px;
    }
    .divider span {
      height: 1px;
      flex: 1;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }
    .divider img { width: 20px; height: 20px; }
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 14px 18px;
    }
    .card {
      background: linear-gradient(145deg, rgba(16, 42, 82, 0.92), rgba(7, 20, 43, 0.95));
      border: 1.5px solid var(--gold);
      border-radius: 18px;
      padding: 12px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,240,179,0.25);
      transition: transform 0.15s ease;
    }
    .card:active { transform: scale(0.98); }
    .card img { width: 40px; height: 40px; flex-shrink: 0; }
    .card-text { flex: 1; }
    .card-text h3 { font-size: 0.85rem; color: #fff; line-height: 1.25; }
    .card-text p { font-size: 0.72rem; color: #d8c396; margin-top: 2px; }
    .feature-screen{display:none;padding:18px 16px 24px;min-height:55vh}
    .feature-screen.visible{display:block}.home-view.hidden{display:none}
    .screen-heading{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .screen-heading h2{color:var(--gold-light);font-size:1.15rem}
    .back-btn,.feature-tab{border:1px solid var(--gold);background:rgba(11,29,58,.85);color:var(--gold-light);border-radius:12px;padding:9px 13px;font:inherit;cursor:pointer}
    .feature-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}
    .feature-tab{padding:9px 4px;font-size:.78rem}.feature-tab.active{background:var(--gold);color:#081833;font-weight:700}
    .feature-content{background:rgba(11,29,58,.78);border:1px solid rgba(229,182,87,.65);border-radius:16px;padding:16px;min-height:120px}
    .empty-state{text-align:center;color:#f3e5c0;line-height:1.8;padding:18px 4px}
    .schedule-entry{padding:12px 4px;border-bottom:1px solid rgba(229,182,87,.25)}
    .rosary-mysteries{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
    .mystery-choice{background:rgba(11,29,58,.9);border:1px solid var(--gold);border-radius:14px;padding:13px 9px;color:#fff;text-align:center;font:inherit;cursor:pointer}
    .mystery-choice.active{background:rgba(229,182,87,.22);box-shadow:0 0 0 1px var(--gold) inset}
    .mystery-choice small{display:block;color:#e8d5a9;margin-top:5px;font-size:.7rem}
    .rosary-progress{height:7px;background:#263b5b;border-radius:9px;overflow:hidden;margin:12px 0}
    .rosary-progress span{display:block;height:100%;background:var(--gold);width:0}
    .rosary-controls{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
    .rosary-controls button{flex:1}.rosary-step{text-align:center;padding:18px 6px;line-height:1.8}.rosary-step h3{color:var(--gold-light);margin-bottom:8px}
    .rosary-guide{text-align:center;line-height:1.8}
    .rosary-guide-step{padding:18px 8px;margin:12px 0;border:1px solid rgba(229,182,87,.45);border-radius:14px;background:rgba(7,20,43,.45)}
    .rosary-guide-step h3{color:var(--gold-light);font-size:1.12rem;margin:8px 0}
    .rosary-guide-meta{color:#e8d5a9;font-size:.82rem}
    .rosary-decade-dots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:14px auto;max-width:260px}
    .rosary-decade-dots span{width:13px;height:13px;border-radius:50%;border:1px solid var(--gold);background:rgba(229,182,87,.12)}
    .rosary-decade-dots span.done{background:var(--gold)}
    .rosary-decade-dots span.current{outline:2px solid var(--gold-light);outline-offset:2px}
    .rosary-guide-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .rosary-guide-actions button{flex:1;min-width:100px}

    .rosary-diagram{margin:14px auto 18px;max-width:390px;padding:10px 8px;border:1px solid rgba(229,182,87,.35);border-radius:16px;background:rgba(7,20,43,.38)}
    .rosary-diagram svg{display:block;width:100%;height:auto;max-height:285px}
    .rosary-diagram .decade-bead{fill:url(#pearlBead);stroke:#a77a3b;stroke-width:1;transition:fill .25s,filter .25s}
    .rosary-diagram .decade-bead.done{fill:url(#doneBead);filter:url(#rosaryGlowSoft)}
    .rosary-diagram .decade-bead.current{fill:url(#doneBead);stroke:#fff;stroke-width:2;filter:url(#rosaryGlow)}
    .rosary-diagram .opening-bead{fill:url(#pearlBead);stroke:#a77a3b;stroke-width:1}
    .rosary-diagram .opening-large-bead{fill:url(#goldBead);stroke:#8e672f;stroke-width:1.2}.rosary-diagram .opening-large-bead.done{fill:url(#doneBead);filter:url(#rosaryGlowSoft)}.rosary-diagram .opening-large-bead.current{fill:url(#doneBead);stroke:#fff;stroke-width:2;filter:url(#rosaryGlow)}
    .rosary-diagram .opening-bead.done{fill:url(#doneBead);filter:url(#rosaryGlowSoft)}
    .rosary-diagram .opening-bead.current{fill:url(#doneBead);stroke:#fff;stroke-width:2;filter:url(#rosaryGlow)}
    .rosary-diagram .separator-bead{fill:url(#goldBead);stroke:#fff0c5;stroke-width:1.2;filter:url(#rosaryGlowSoft)}.rosary-diagram .separator-bead.done{fill:url(#doneBead);filter:url(#rosaryGlowSoft)}.rosary-diagram .separator-bead.current{fill:url(#doneBead);stroke:#fff;stroke-width:2;filter:url(#rosaryGlow)}
    .rosary-diagram .bead-shine{fill:rgba(255,255,255,.52);stroke:rgba(255,255,255,.28);stroke-width:.35;pointer-events:none}
    .rosary-diagram .bead-glint{fill:#fff;opacity:.8;pointer-events:none;filter:drop-shadow(0 0 1px #fff)}
    .rosary-diagram .decade-bead,.rosary-diagram .opening-bead,.rosary-diagram .opening-large-bead,.rosary-diagram .separator-bead{filter:url(#beadShadow)}
    .rosary-diagram .rosary-cord{fill:none;stroke:url(#cordGold);stroke-width:3.2;stroke-linecap:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
    .rosary-diagram .medal-rim{fill:url(#goldBead);stroke:#fff0bd;stroke-width:1.5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
    .rosary-diagram .medal-center{fill:#263d60;stroke:#f8dfa0;stroke-width:1.3}
    .rosary-diagram .medal-mark{fill:none;stroke:#f8dfa0;stroke-width:1.2;stroke-linecap:round}
    .rosary-diagram .rosary-crucifix path{fill:none;stroke:url(#crossGold);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
    .rosary-diagram .rosary-crucifix .cross-highlight{stroke:#fff0bd;stroke-width:1.2;opacity:.8;filter:none}
    .rosary-diagram .rosary-cord{fill:none;stroke:#9b7542;stroke-width:2.1;opacity:.95;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
    .rosary-diagram .rosary-cross{fill:none;stroke:#d8bd82;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
    .rosary-diagram .rosary-medal{fill:url(#goldBead);stroke:#f5d58a;stroke-width:1.6}
    .rosary-diagram .medal-center{fill:#31476a;stroke:#f4d58a;stroke-width:1}
    .rosary-diagram .rosary-diagram-label{fill:#f3e5c0;font-size:10px;text-anchor:middle}

    .rosary-recommendation{border:1px solid rgba(229,182,87,.55);border-radius:12px;padding:11px;margin:10px 0;color:#f3e5c0;background:rgba(229,182,87,.08);line-height:1.7}

    .prayer-search{display:block;width:100%;margin:0 0 16px;padding:12px 14px;border:1px solid rgba(229,182,87,.7);border-radius:12px;background:rgba(7,20,43,.85);color:#fff;font:inherit;direction:inherit}.prayer-reader-tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.prayer-reader-tools .feature-tab{flex:1;min-width:64px}
    .prayer-audio-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.prayer-audio-controls .feature-tab{flex:1;min-width:88px}.prayer-audio-status{min-height:1.5em;color:#f3e5c0;font-size:.82rem;margin:6px 2px 12px}
    .prayer-category{margin-bottom:14px}.prayer-category h3{color:var(--gold-light);margin-bottom:9px}.prayer-choice{display:block;width:100%;text-align:start;background:rgba(11,29,58,.9);border:1px solid rgba(229,182,87,.55);border-radius:12px;color:#fff;padding:12px;margin:7px 0;font:inherit;cursor:pointer}.prayer-text{white-space:pre-wrap;line-height:2;text-align:start;padding:14px 4px;color:#fff}.prayer-audio-note{color:#e8d5a9;font-size:.82rem;margin-top:12px}
    .bottom-nav {
      background: var(--navy-nav);
      border-top: 1.5px solid var(--gold);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 4px 12px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #d8c396;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .nav-item.active { color: var(--gold-light); font-weight: 700; }
    .nav-item img { width: 24px; height: 24px; }
      .mass-calendar{border:1px solid rgba(229,182,87,.55);border-radius:16px;padding:12px;background:rgba(8,22,45,.82);margin-bottom:18px}
    .mass-calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--gold-light)}
    .mass-calendar-head button,.mass-calendar-today{border:1px solid rgba(229,182,87,.55);background:rgba(229,182,87,.12);color:#fff;border-radius:9px;padding:8px 13px;font:inherit;cursor:pointer}
    .mass-calendar-week,.mass-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
    .mass-calendar-week{font-size:.75rem;color:#e8d5a9;margin-bottom:7px}
    .mass-calendar-day{min-width:0;aspect-ratio:1;border:1px solid rgba(229,182,87,.18);border-radius:9px;background:rgba(255,255,255,.04);color:#fff;font:inherit;cursor:pointer;position:relative}
    .mass-calendar-day.selected{background:var(--gold);color:#17233a;font-weight:800}
    .mass-calendar-day.has-entry:after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold-light);bottom:4px;left:calc(50% - 2px)}
    .mass-calendar-day.selected.has-entry:after{background:#17233a}
    .mass-calendar-empty{aspect-ratio:1}
    .mass-calendar-today{margin-top:12px;width:100%}
    .mass-selected-title{font-size:1rem;color:var(--gold-light);margin:14px 0 10px}
      html[data-text-size="small"] .feature-content{font-size:.9rem}
    html[data-text-size="large"] .feature-content{font-size:1.15rem}
      .church-history-list{padding-inline-start:22px;line-height:1.9}.church-history-list li{padding:5px 0}.church-action-link{display:flex;align-items:center;gap:10px;margin:10px 0;padding:13px;border:1px solid rgba(229,182,87,.65);border-radius:12px;background:rgba(229,182,87,.09);color:var(--gold-light);text-decoration:none;font-weight:700}.church-menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.church-menu-card{min-width:0;min-height:118px;padding:14px 8px;border:1px solid rgba(229,182,87,.65);border-radius:14px;background:rgba(229,182,87,.09);color:var(--gold-light);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font:inherit;font-weight:700;cursor:pointer}.church-menu-icon{font-size:2rem;line-height:1}.card-symbol{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;font-size:1.8rem}.language-menu-wrap{position:relative}
    .language-gear{display:flex;align-items:center;justify-content:center;min-width:42px;min-height:42px}
    .language-dropdown{position:absolute;top:calc(100% + 8px);right:0;z-index:1000;min-width:150px;padding:6px;border:1px solid var(--gold);border-radius:12px;background:var(--navy-nav);box-shadow:0 10px 28px rgba(0,0,0,.35);direction:ltr}
    .language-dropdown[hidden]{display:none}
    .language-dropdown button{display:block;width:100%;padding:11px 13px;border:0;border-radius:8px;background:transparent;color:#fff;text-align:start;font:inherit;cursor:pointer}
    .language-dropdown button:hover,.language-dropdown button:focus{background:rgba(229,182,87,.18);outline:none}
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="home-view" id="home-view">
      <header class="top-bar">
        <img src="assets/icons/logo-marian-emblem.png" alt="Emblem" class="emblem" />
        <div class="header-title">
          <h1 id="app-title">كنيسة سيدة المعونات</h1>
          <p id="app-subtitle">- رعيتنا بيت الصلاة والإيمان -</p>
        </div>
        <div class="top-actions language-menu-wrap">
          <button class="lang-btn language-gear" id="language-menu-button" type="button" aria-label="Choose language" aria-haspopup="true" aria-expanded="false" onclick="toggleLanguageMenu(event)"><img src="assets/icons/icon-settings.png" alt="" style="width:22px;height:22px;vertical-align:middle" /></button>
          <div class="language-dropdown" id="language-dropdown" role="menu" hidden>
            <button type="button" role="menuitem" onclick="selectLanguage('ar')">العربية</button>
            <button type="button" role="menuitem" onclick="selectLanguage('fr')">Français</button>
            <button type="button" role="menuitem" onclick="selectLanguage('it')">Italiano</button>
          </div>
        </div>
      </header>

      <div class="hero-spacer"></div>

      <section class="welcome-banner">
        <h2 id="welcome-text">أهلاً بكم في رعيتنا</h2>
        <p id="motto-text">«سيدة المعونات .. تشفع فينا»</p>
      </section>

      <div class="divider">
        <span></span>
        <img src="assets/icons/icon-cross-divider.png" alt="Cross" />
        <span></span>
      </div>

      <main class="cards-grid" id="cards-container"></main>
    </div>
    <section class="feature-screen" id="mass-screen" aria-live="polite">
      <div class="screen-heading"><button class="back-btn" onclick="closeFeature()" id="mass-back">←</button><h2 id="mass-title"></h2></div>
      <div class="feature-tabs" id="mass-tabs"></div><div class="feature-content" id="mass-content"></div>
    </section>
    <section class="feature-screen" id="rosary-screen" aria-live="polite"><div class="screen-heading"><button class="back-btn" onclick="closeRosary()" id="rosary-back">←</button><h2 id="rosary-title"></h2></div><div class="feature-content" id="rosary-content"></div></section><section class="feature-screen" id="prayer-library-screen" aria-live="polite"><div class="screen-heading"><button class="back-btn" onclick="closePrayerLibrary()" id="prayer-library-back">←</button><h2 id="prayer-library-title"></h2></div><div class="feature-content" id="prayer-library-content"></div></section><section class="feature-screen" id="announcements-screen" aria-live="polite"><div class="screen-heading"><button class="back-btn" onclick="closeAnnouncements()" id="announcements-back">←</button><h2 id="announcements-title"></h2></div><div class="feature-content" id="announcements-content"></div></section><section class="feature-screen" id="parish-life-screen" aria-live="polite"><div class="screen-heading"><button class="back-btn" onclick="closeParishLife()" id="parish-life-back">←</button><h2 id="parish-life-title"></h2></div><div class="feature-tabs" id="parish-life-tabs"></div><div class="feature-content" id="parish-life-content"></div></section><section class="feature-screen" id="prayer-requests-screen" aria-live="polite"><div class="screen-heading"><button class="back-btn" onclick="closePrayerRequests()" id="prayer-requests-back">←</button><h2 id="prayer-requests-title"></h2></div><div class="feature-content" id="prayer-requests-content"></div></section><section class="feature-screen" id="favorites-screen" aria-live="polite"><div class="screen-heading"><button class="back-btn" onclick="closeFavorites()" id="favorites-back">←</button><h2 id="favorites-title"></h2></div><div class="feature-content" id="favorites-content"></div></section><section class="feature-screen" id="notifications-screen" aria-live="polite"><div class="screen-heading"><button class="back-btn" onclick="closeSimpleScreen('notifications-screen')" id="notifications-back">←</button><h2 id="notifications-title"></h2></div><div class="feature-content" id="notifications-content"></div></section><section class="feature-screen" id="about-screen" aria-live="polite"><div class="screen-heading"><button class="back-btn" onclick="closeSimpleScreen('about-screen')" id="about-back">←</button><h2 id="about-title"></h2></div><div class="feature-content" id="about-content"></div></section><section class="feature-screen" id="settings-screen" aria-live="polite"><div class="screen-heading"><button class="back-btn" onclick="closeSimpleScreen('settings-screen')" id="settings-back">←</button><h2 id="settings-title"></h2></div><div class="feature-content" id="settings-content"></div></section><nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <script>

      steps.push({kind:'prayer',section:rosaryLabels[currentLang].opening,title:label('creed')});

      steps.push({kind:'prayer',section:rosaryLabels[currentLang].opening,title:label('glory-be-opening')});

    }

    async function loadParishLife(){
      const box=document.getElementById('parish-life-content');box.innerHTML='<p class="empty-state">'+parishLifeLabels[currentLang].loading+'</p>';
      try{const response=await fetch('src/data/parish-life.json',{cache:'no-store'});if(!response.ok)throw new Error('request failed');parishLifeData=await response.json();renderParishLife();}
      catch(e){box.innerHTML='<p class="empty-state">'+parishLifeLabels[currentLang].error+'</p>';}

    function renderParishLife(){
      const l=parishLifeLabels[currentLang];document.getElementById('parish-life-title').textContent=l.title;document.getElementById('parish-life-back').textContent=l.back;
      document.getElementById('parish-life-tabs').innerHTML=l.tabs.map((label,i)=>'<button class="feature-tab '+(i===parishLifeTab?'active':'')+'" onclick="selectParishLifeTab('+i+')">'+label+'</button>').join('');
      const box=document.getElementById('parish-life-content');if(!parishLifeData){box.innerHTML='<p class="empty-state">'+l.error+'</p>';return;}
      const keys=['groups','activities','galleries'],emptyKeys=['emptyGroups','emptyActivities','emptyGalleries'],items=parishLifeData[keys[parishLifeTab]]||[];
      if(!items.length){box.innerHTML='<p class="empty-state">'+l[emptyKeys[parishLifeTab]]+'</p>';return;}

        const title=item['title'+currentLang.toUpperCase()]||item.title?.[currentLang]||item.name?.[currentLang]||item.title||item.name||'';
        const description=item['description'+currentLang.toUpperCase()]||item.description?.[currentLang]||item.description||'';

    function togglePrayerFavorite(categoryId,prayerId){
      const category=prayerLibraryData?.categories.find(x=>x.id===categoryId),prayer=category?.prayers.find(x=>x.id===prayerId);if(!prayer)return;
      let items=getFavorites();const found=items.some(x=>x.type==='prayer'&&x.id===prayerId);
